<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1b1f2a;--mut:#667085;--bd:#e4e7ee;--ac:#4f46e5;--ac2:#eef0ff;--ok:#16a34a;--warn:#d97706;--bad:#dc2626}
[data-theme=dark]{--bg:#0f1220;--card:#181c2e;--tx:#eceefb;--mut:#9aa3c0;--bd:#2a3050;--ac:#8b86ff;--ac2:#232850;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx)}
#app{max-width:900px;margin:0 auto;padding:12px 12px 90px}
header{display:flex;align-items:center;gap:8px;margin-bottom:12px}
header h1{font-size:18px;margin:0;flex:1}
h2{font-size:16px;margin:18px 0 8px}
h3{font-size:15px;margin:0 0 6px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.mut{color:var(--mut);font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{justify-content:space-between}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.btn{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:9px 14px;font:inherit;font-weight:600;cursor:pointer}
.btn.sec{background:var(--ac2);color:var(--ac)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
input,select,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:9px;padding:8px 10px;max-width:100%}
input[type=number]{width:90px}
input[type=text],input[type=date],textarea{width:100%}
textarea{min-height:70px;resize:vertical}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--ac2);color:var(--ac)}
.chip.ok{background:#16a34a22;color:var(--ok)}.chip.warn{background:#d9770622;color:var(--warn)}.chip.bad{background:#dc262622;color:var(--bad)}
.bar{height:8px;border-radius:99px;background:var(--bd);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ac)}
.blk{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--bd)}
.blk:first-of-type{border-top:0}
.blk .r{display:flex;gap:8px;align-items:center;white-space:nowrap}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);display:flex;justify-content:center;z-index:5}
nav button{flex:1;max-width:150px;background:none;border:0;padding:10px 4px 12px;font:inherit;font-size:12px;color:var(--mut);cursor:pointer}
nav button.on{color:var(--ac);font-weight:700}
nav button b{display:block;font-size:18px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--bd);vertical-align:top}
.scroll{overflow-x:auto}
.ov{position:fixed;inset:0;background:#0007;display:flex;align-items:flex-end;justify-content:center;z-index:20}
.modal{background:var(--card);width:100%;max-width:520px;border-radius:16px 16px 0 0;padding:16px;max-height:90vh;overflow:auto}
@media(min-width:600px){.ov{align-items:center}.modal{border-radius:16px}}
.toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);background:#111;color:#fff;padding:9px 14px;border-radius:10px;z-index:30;font-size:14px;max-width:90%}
.opt{display:flex;gap:10px;flex-wrap:wrap}
.opt label{margin:0;border:1px solid var(--bd);border-radius:10px;padding:10px 12px;color:var(--tx);cursor:pointer;display:flex;gap:6px;align-items:center}
.ch{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:6px 0;border-top:1px solid var(--bd)}
.ch .nm{flex:1;min-width:120px}
.warnbox{background:#d9770618;border:1px solid var(--warn);border-radius:10px;padding:10px;font-size:13px;margin-bottom:12px}
</style>
</head>

var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var DAYN=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
var KEY='ca_studyos_v1',TKEY='ca_studyos_theme';

/* ---------- helpers ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function uid(){return Math.random().toString(36).slice(2,9);}
function clamp(x,a,b){return Math.max(a,Math.min(b,x));}
function r1(x){return Math.round(x*10)/10;}
function pad(n){return (n<10?'0':'')+n;}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function parse(s){var a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2],12,0,0);}
function today(){var d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate(),12,0,0);}
function addDays(d,n){var x=new Date(d.getTime());x.setDate(x.getDate()+n);return x;}
function diff(a,b){return Math.round((b-a)/864e5);}
function fmt(d){return d.getDate()+' '+MON[d.getMonth()]+' '+d.getFullYear();}
function fmtMin(m){var h=Math.floor(m/60),x=m%60;return (h?h+'h ':'')+(x||!h?x+'m':'');}
function slot(m){return m<=2?0:(m<=6?1:2);}
function aIdx(d){return d.getFullYear()*3+slot(d.getMonth());}
function aLabel(i){return ['Jan','May','Sep'][i%3]+' '+Math.floor(i/3);}
function aDate(i){return new Date(Math.floor(i/3),[0,4,8][i%3],15,12,0,0);}
function plab(k){return 'P'+k.slice(2);}
function pfull(k){return plab(k)+' '+PAPERS[k].n;}
function weekStart(d){return addDays(d,-((d.getDay()+6)%7));}

/* ---------- storage ---------- */
var storageOK=true;
function load(){
  try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r);if(o&&o.profiles)return o;}}catch(e){storageOK=false;}
  return {v:1,active:null,profiles:[]};
}
var S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){storageOK=false;}}
function theme(){
  var t=null;try{t=localStorage.getItem(TKEY);}catch(e){}
  if(t)return t;
  return (window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';
}
function cur(){for(var i=0;i<S.profiles.length;i++)if(S.profiles[i].id===S.active)return S.profiles[i];return S.profiles[0]||null;}

/* ---------- profile ---------- */

var SUB={
'Presentation & Disclosures Based Accounting Standards':['AS 1 Disclosure of Accounting Policies','AS 3 Cash Flow Statements','AS 17 Segment Reporting','AS 18 Related Party Disclosures','AS 24 Discontinuing Operations'],
'Assets Based Accounting Standards':['AS 2 Valuation of Inventories','AS 10 Property, Plant and Equipment','AS 13 Accounting for Investments','AS 16 Borrowing Costs','AS 19 Leases','AS 26 Intangible Assets'],
'Liabilities Based Accounting Standards':['AS 15 Employee Benefits','AS 29 Provisions, Contingent Liabilities and Contingent Assets'],
'Accounting Standards Based on Items Impacting Financial Statements':['AS 4 Contingencies and Events after the Balance Sheet Date','AS 5 Net Profit or Loss, Prior Period Items and Changes in Accounting Policies','AS 11 Effects of Changes in Foreign Exchange Rates','AS 12 Government Grants','AS 14 Accounting for Amalgamations','AS 20 Earnings Per Share','AS 22 Taxes on Income'],
'Business Laws – The Indian Contract Act, 1872':['Unit 1 Nature of Contract and its Essentials','Unit 2 Consideration','Unit 3 Other Essential Elements of a Valid Contract','Unit 4 Performance of Contract','Unit 5 Breach of Contract and its Remedies','Unit 6 Contingent and Quasi Contracts','Unit 7 Contract of Indemnity and Guarantee','Unit 8 Contract of Bailment and Pledge','Unit 9 Contract of Agency'],
'Business Laws – The Sale of Goods Act, 1930':['Unit 1 Formation of the Contract of Sale','Unit 2 Conditions and Warranties','Unit 3 Transfer of Property','Unit 4 Performance of the Contract of Sale','Unit 5 Rights of an Unpaid Seller','Unit 6 Remedies for Breach'],
'Business Laws – The Indian Partnership Act, 1932':['Unit 1 Nature of Partnership','Unit 2 Relations of Partners to One Another','Unit 3 Relations of Partners with Third Parties','Unit 4 Admission, Retirement and Expulsion','Unit 5 Dissolution of Firm','Unit 6 Registration of Firms']
};
function mkCh(grp,unit,status){return {id:uid(),name:grp+' › '+unit,grp:grp,unit:unit,status:status||'todo',conf:3,revs:[]};}
function expandStd(nm){return SUB[nm]?SUB[nm].map(function(u){return mkCh(nm,u);}):[{id:uid(),name:nm,status:'todo',conf:3,revs:[]}];}
function grpOf(c){if(c.grp)return c.grp;var i=c.name.indexOf(' – ');return i>0?c.name.slice(0,i):'';}
function lblOf(c){if(c.unit)return c.unit;var i=c.name.indexOf(' – ');return i>0?c.name.slice(i+3):c.name;}
function starter(k){var o=[];(SYL[k]||[]).forEach(function(n){o=o.concat(expandStd(n));});return o;}

/* ---------- ICAI calendar + syllabus version (can be updated from the cloud without re-uploading this file) ---------- */
var CAL={version:'2026-10-25',attempts:{'Jan 2027':{
  papers:{FD1:'2027-01-03',FD2:'2027-01-05',FD3:'2027-01-07',FD4:'2027-01-09',IN1:'2027-01-02',IN2:'2027-01-04',IN3:'2027-01-06',IN4:'2027-01-08',IN5:'2027-01-10',IN6:'2027-01-12'},
  form:{open:'2026-11-03',last:'2026-11-16',late:'2026-11-19',fee:'Rs 600',correct:'2026-11-22'},
  result:'First week of March 2027 (expected, exact date not announced yet)'}}};
var SYLVER='2026-10-25',SYLREM={},SYLINFO='';
var RCK='ca_studyos_remote';
function applyRemote(r){
  if(!r)return;
  if(r.calendar&&r.calendar.attempts){CAL.attempts=Object.assign({},CAL.attempts,r.calendar.attempts);if(r.calendar.version)CAL.version=r.calendar.version>CAL.version?r.calendar.version:CAL.version;}
  var y=r.syllabus;
  if(y&&y.version&&y.version>SYLVER){
    SYLVER=y.version;SYLINFO=y.note||'';
    if(y.SYL)SYL=Object.assign({},SYL,y.SYL);
    if(y.SUB)SUB=Object.assign({},SUB,y.SUB);
    SYLREM=y.remove||{};
  }
}
try{applyRemote(JSON.parse(localStorage.getItem(RCK)||'null'));}catch(e){}
function icaiStart(level,groups,label){
  var e=CAL.attempts[label];if(!e||!LEVELS[level])return null;
  var L=LEVELS[level],ks=[];
  (groups||[]).forEach(function(g){if(L.groups[g])ks=ks.concat(L.groups[g].p);});
  var ds=ks.map(function(k){return e.papers[k];}).filter(Boolean).sort();
  return ds[0]||null;
}
function normP(P){
  var ch=false;
  if(P.dateAuto===undefined){var lab0=aLabel(aIdx(parse(P.examDate)));P.dateAuto=(P.examDate===iso(aDate(aIdx(parse(P.examDate)))))||(P.examDate===icaiStart(P.level,P.groups,lab0));}
  if(P.dateAuto){
    var d=icaiStart(P.level,P.groups,aLabel(aIdx(parse(P.examDate))));
    if(d&&d!==P.examDate){P.examDate=d;ch=true;}
  }
  if(P.sylVer===undefined)P.sylVer='0';
  if(P.sylVer<SYLVER){var df=sylDiff(P);if(df.add+df.rem+df.mig===0){P.sylVer=SYLVER;ch=true;}}
  if(ch){P.dirty=true;save();schedSync();}
}
function sylDiff(P){
  var add=0,rem=0,mig=0;
  Object.keys(P.papers).forEach(function(k){
    var have={};P.papers[k].ch.forEach(function(x){have[x.name.toLowerCase()]=1;});
    (SYL[k]||[]).forEach(function(nm){
      if(SUB[nm]){if(have[nm.toLowerCase()])mig++;SUB[nm].forEach(function(u){if(!have[(nm+' › '+u).toLowerCase()])add++;});}
      else if(!have[nm.toLowerCase()])add++;
    });
    (SYLREM[k]||[]).forEach(function(nm){P.papers[k].ch.forEach(function(x){if((x.name.toLowerCase()===nm.toLowerCase()||(x.grp||'').toLowerCase()===nm.toLowerCase())&&!x.removed)rem++;});});
  });
  return {add:add,rem:rem,mig:mig};
}
function applySyl(P){
  var added=0,removed=0,flagged=0;
  Object.keys(P.papers).forEach(function(k){
    var Lc=P.papers[k].ch,have={};Lc.forEach(function(x){have[x.name.toLowerCase()]=1;});
    (SYL[k]||[]).forEach(function(nm){
      if(SUB[nm]){
        var idx=-1;Lc.forEach(function(x,i){if(x.name===nm)idx=i;});
        var st='todo',old=null;
        if(idx>=0){old=Lc[idx];st=old.status;Lc.splice(idx,1);}
        var items=SUB[nm].filter(function(u){return !have[(nm+' › '+u).toLowerCase()];}).map(function(u){var c=mkCh(nm,u,st);if(old&&st==='done'){c.doneOn=old.doneOn;c.revs=old.revs||[];c.conf=old.conf||3;}return c;});
        Array.prototype.splice.apply(Lc,[idx>=0?idx:Lc.length,0].concat(items));added+=items.length;
      }else if(!have[nm.toLowerCase()]){Lc.push({id:uid(),name:nm,status:'todo',conf:3,revs:[]});added++;}
    });
    (SYLREM[k]||[]).forEach(function(nm){
      for(var i=Lc.length-1;i>=0;i--){
        var x=Lc[i];
        if(x.name.toLowerCase()===nm.toLowerCase()||(x.grp||'').toLowerCase()===nm.toLowerCase()){
          if(x.status==='todo'){Lc.splice(i,1);removed++;}else if(!x.removed){x.removed=true;flagged++;}
        }
      }
    });
  });
  P.sylVer=SYLVER;
  return {added:added,removed:removed,flagged:flagged};
}

/* ---------- timer, weak chapters, streak, weekly report, reminder ---------- */
var TMK='ca_studyos_timer';
function tmGet(){try{return JSON.parse(localStorage.getItem(TMK)||'null');}catch(e){return null;}}
function tmSet(v){try{if(v)localStorage.setItem(TMK,JSON.stringify(v));else localStorage.removeItem(TMK);}catch(e){}}
function p2(n){return (n<10?'0':'')+n;}
function tmText(t){var s=Math.max(0,Math.floor((Date.now()-t.t0)/1000));return p2(Math.floor(s/3600))+':'+p2(Math.floor(s/60)%60)+':'+p2(s%60);}
function streakDays(P){
  var t=today(),days={};P.sessions.forEach(function(s){days[s.date]=(days[s.date]||0)+s.min;});
  var n=0,d=t;if(!days[iso(d)])d=addDays(d,-1);
  while(days[iso(d)]>0){n++;d=addDays(d,-1);}
  return n;
}
function weakChapters(P,study,n){
  var out=[];
  study.forEach(function(k){
    P.papers[k].ch.forEach(function(ch){
      if(ch.removed)return;
      var sc=0,why=[];
      if(ch.status!=='todo'&&ch.conf<=2){sc+=3-ch.conf;why.push('low confidence');}
      var mis=0,low=0;
      P.sessions.forEach(function(s){if(s.paper===k&&s.chapter===ch.name){if(s.mistakes)mis++;if(s.rating&&s.rating<=2)low++;}});
      if(mis){sc+=mis;why.push(mis+' mistake note'+(mis>1?'s':''));}
      if(low){sc+=low;why.push('understood poorly');}
      if(sc>0)out.push({k:k,ch:ch,sc:sc,why:why.join(', ')});
    });
  });
  return out.sort(function(a,b){return b.sc-a.sc;}).slice(0,n||5);
}
function weekReport(P){
  var t=today(),ws=weekStart(t),pw=addDays(ws,-7);
  var th=sessMins(P,ws,addDays(ws,6))/60,lh=sessMins(P,pw,addDays(pw,-1+7))/60;
  var a=iso(ws),b=iso(addDays(ws,6)),chD=0;
  var per={};
  P.sessions.forEach(function(s){if(s.date>=a&&s.date<=b)per[s.paper]=(per[s.paper]||0)+s.min;});
  Object.keys(P.papers).forEach(function(k){P.papers[k].ch.forEach(function(c){if(c.status==='done'&&c.doneOn&&c.doneOn>=a&&c.doneOn<=b)chD++;});});
  var top=Object.keys(per).sort(function(x,y){return per[y]-per[x];})[0];
  var mk=P.mocks.filter(function(m){return m.date>=a&&m.date<=b;}).length;
  return {th:r1(th),lh:r1(lh),ch:chD,top:top?pfull(top):'',topH:top?r1(per[top]/60):0,mocks:mk,streak:streakDays(P),days:t,goal:P.weeklyGoal};
}

/* ---------- results analysis + exemption ---------- */
function analyse(P){
  var L=LEVELS[P.level];
  var att=P.attempts.slice().sort(function(a,b){return a.date<b.date?-1:(a.date>b.date?1:0);});
  var ex={},passed={},rows=[];
  att.forEach(function(a){
    var idx=aIdx(parse(a.date)),row={a:a,groups:[]};
    Object.keys(L.groups).forEach(function(g){
      if(passed[g])return;
      var G=L.groups[g],eff={},real=0,miss=[];
      G.p.forEach(function(k){
        var m=a.marks[k];
        if(typeof m==='number'&&!isNaN(m)){eff[k]=m;real++;}
        else if(ex[k]&&ex[k].exp>=idx){eff[k]=ex[k].mark;}
        else miss.push(k);
      });
      if(!real)return;
      var sum=0,low=[];
      G.p.forEach(function(k){if(eff[k]!==undefined){sum+=eff[k];if(eff[k]<40)low.push(k);}});
      var max=G.p.length*100;
      var pass=miss.length===0&&low.length===0&&sum>=max*0.5;
      var gr={g:g,n:G.n,pass:pass,sum:sum,max:max,miss:miss,low:low,aggFail:miss.length===0&&sum<max*0.5,newEx:[]};
      if(pass){passed[g]={label:a.label,idx:idx};}
      else if(miss.length===0&&L.exempt){
        G.p.forEach(function(k){
          var m=a.marks[k];
          if(typeof m==='number'&&m>=60&&!(ex[k]&&ex[k].exp>=idx)){ex[k]={mark:m,exp:idx+3,from:a.label};gr.newEx.push(k);}
        });
      }
      row.groups.push(gr);
    });
    rows.push(row);
  });
  return {rows:rows,ex:ex,passed:passed};
}
function activeInfo(P,A){
  var L=LEVELS[P.level],tIdx=aIdx(parse(P.examDate)),groups=[],study=[],exempt=[];
  P.groups.forEach(function(g){
    var G=L.groups[g];if(!G)return;
    if(A.passed[g]){groups.push({g:g,n:G.n,p:G.p,passed:A.passed[g].label});return;}
    var exs=G.p.filter(function(k){return A.ex[k]&&A.ex[k].exp>=tIdx;});
    var rest=G.p.filter(function(k){return exs.indexOf(k)<0;});
    var sumEx=exs.reduce(function(s,k){return s+A.ex[k].mark;},0);
    var need=Math.max(rest.length*40,G.p.length*50-sumEx);
    groups.push({g:g,n:G.n,p:G.p,exs:exs,rest:rest,need:need,avg:rest.length?need/rest.length:0});
    exempt=exempt.concat(exs);study=study.concat(rest);
  });
  return {groups:groups,study:study,exempt:exempt,tIdx:tIdx};
}


/* ---------- journey: earlier-level marks, route, unlock ---------- */
var PRIOR={IN1:['FD1'],IN2:['FD2'],IN6:['FD3'],FN1:['IN1'],FN2:['IN6'],FN3:['IN5'],FN4:['IN3'],FN5:['IN3']};
function histLevel(P){return P.level==='inter'?'foundation':(P.level==='final'?'inter':null);}
function priorScore(P,k){
  var src=PRIOR[k],best=null;if(!src||!P.hist)return null;
  src.forEach(function(sk){var lv=sk.slice(0,2)==='FD'?'foundation':'inter';(P.hist[lv]||[]).forEach(function(a){var m=a.marks&&a.marks[sk];if(typeof m==='number'&&(!best||a.date>=best.d))best={d:a.date,v:m};});});
  return best?best.v:null;
}
function histA(hist,lvl){return analyse({level:lvl,attempts:(hist&&hist[lvl])||[]});}
function directOK(type,pct){
  var p=Number(pct);
  if(type==='prof')return {ok:true,msg:'Qualified CA/CS/CMA: eligible for direct entry.'};
  if(type==='commerce')return p>=55?{ok:true,msg:'Commerce graduate/PG with '+p+'%: eligible (needs 55%).'}:{ok:false,msg:'Commerce graduates need at least 55%. Foundation route is the way.'};
  if(type==='other')return p>=60?{ok:true,msg:'Non-commerce graduate/PG with '+p+'%: eligible (needs 60%).'}:{ok:false,msg:'Other graduates need at least 60%. Foundation route is the way.'};
  return {ok:false,msg:'Direct entry needs a graduation/PG degree (or CS/CMA). Otherwise start with Foundation.'};
}
function canStart(o){
  if(o.level==='foundation')return {ok:true,msg:''};
  if(o.level==='inter'){
    if(o.route==='direct'){var d=directOK(o.gtype,o.gpct);return {ok:d.ok,msg:d.msg+(d.ok?' Confirm on icai.org before registering.':'')};}
    var A=histA(o.hist,'foundation');
    return A.passed.ALL?{ok:true,msg:'Foundation passed ('+A.passed.ALL.label+'). Intermediate is open.'}:{ok:false,msg:'Intermediate opens after you pass Foundation. Add your Foundation attempt marks below, or choose Direct entry if you are a graduate.'};
  }
  var B=histA(o.hist,'inter');
  if(o.confirmInter||(B.passed.G1&&B.passed.G2))return {ok:true,msg:'Final is open.'};
  return {ok:false,msg:'Final opens after you pass both Intermediate groups. Add your Intermediate marks below or tick the box.'};
}

/* ---------- scores, hours, weakness ---------- */
function lastScore(P,k){
  var best=null;
  P.attempts.forEach(function(a){var m=a.marks[k];if(typeof m==='number'&&(!best||a.date>=best.d))best={d:a.date,v:m};});
  P.mocks.forEach(function(m){if(m.paper===k&&m.max>0){var v=m.score/m.max*100;if(!best||m.date>=best.d)best={d:m.date,v:v};}});
  return best?best.v:null;
}
function weak(P,k){var v=lastScore(P,k);if(v===null){var pv=priorScore(P,k);if(pv===null)return 0.3;return clamp((P.target-(pv-5))/P.target,0,1);}return clamp((P.target-v)/P.target,0,1);}
function hoursDone(P,k){return P.sessions.filter(function(s){return s.paper===k&&s.date>=P.planStart;}).reduce(function(t,s){return t+s.min;},0)/60;}
function remH(P,k){return Math.max(0,P.papers[k].h-hoursDone(P,k));}

/* ---------- plan engine ---------- */
function planInfo(P,A,X){
  var t=today(),ex=parse(P.examDate),days=diff(t,ex);
  var dd=Math.max(days,0);
  var revDays=dd>45?Math.max(20,Math.round(dd*0.25)):Math.round(dd*0.4);
  var mockDays=Math.min(15,Math.round(dd*0.15));
  var phase=days<0?'over':(days<=mockDays?'mock':(days<=revDays?'revise':'learn'));
  var learnLeft=Math.max(0,days-revDays);
  var rem=X.study.reduce(function(s,k){return s+remH(P,k);},0);
  var avail=learnLeft*(P.rest>=0?6/7:1);
  var need=avail>0?rem/avail:(rem>0?Infinity:0);
  var status=rem===0?'done':(need<=P.dailyHours*0.95?'ontrack':(need<=P.dailyHours*1.2?'tight':'behind'));
  return {t:t,ex:ex,days:days,revDays:revDays,mockDays:mockDays,phase:phase,learnLeft:learnLeft,rem:rem,need:need,status:status};
}
function weights(P,X,phase,remMap){
  var w={};
  X.study.forEach(function(k){
    var wk=weak(P,k),f=P.papers[k].focus,r=remMap?remMap[k]:remH(P,k);
    if(phase==='learn')w[k]=r>0?r*(1+wk*0.6+(f?0.5:0)):0;
    else w[k]=(1+wk*1.5+(f?0.4:0))*(1+(r/Math.max(1,P.papers[k].h))*0.5);
  });
  return w;
}
function allocate(total,w){
  var ks=Object.keys(w).filter(function(k){return w[k]>0;});
  if(!ks.length||total<=0)return {};
  var sum=ks.reduce(function(s,k){return s+w[k];},0),out={},used=0;
  ks.forEach(function(k){out[k]=Math.floor(total*w[k]/sum/15)*15;used+=out[k];});
  var left=total-used,order=ks.slice().sort(function(a,b){return w[b]-w[a];}),i=0;
  while(left>=15){out[order[i%order.length]]+=15;left-=15;i++;}
  ks.forEach(function(k){if(k!==order[0]&&out[k]>0&&out[k]<30){out[order[0]]+=out[k];out[k]=0;}});
  return out;
}
function why(P,k,phase){
  var r=[],lv=lastScore(P,k);
  if(lv!==null)r.push('last score '+Math.round(lv)+'/100');
  else{var pv=priorScore(P,k);if(pv!==null)r.push('earlier level, related subject: '+Math.round(pv)+'/100');}
  if(P.papers[k].focus)r.push('focus paper');
  if(phase==='learn')r.push(Math.round(remH(P,k))+' hrs of syllabus left');
  else r.push(phase==='mock'?'exam is close: practice and fix mistakes':'revision phase');
  return r.join(' \u2022 ');
}
function revDue(P,t){
  var out=[],ts=iso(t);
  Object.keys(P.papers).forEach(function(k){P.papers[k].ch.forEach(function(c){(c.revs||[]).forEach(function(r){if(!r.done&&r.due<=ts)out.push({k:k,c:c,r:r});});});});
  return out.sort(function(a,b){return a.r.due<b.r.due?-1:(a.r.due>b.r.due?1:0);});
}
function todayPlan(c){
  var P=c.P,X=c.X,I=c.I,t=I.t,rv=revDue(P,t),blocks=[];
  if(P.rest>=0&&t.getDay()===P.rest)return {rest:true,blocks:[],rv:rv};
  var mins=Math.round(P.dailyHours*60);
  if(!X.study.length||I.phase==='over')return {rest:false,blocks:[],rv:rv};
  var revMin=Math.min(rv.length*20,Math.round(mins*0.35/5)*5);
  if(rv.length&&revMin>0){
    var by={};rv.forEach(function(x){by[x.k]=(by[x.k]||0)+1;});
    var scale=revMin/(rv.length*20);
    Object.keys(by).forEach(function(k){
      var m=Math.max(10,Math.round(by[k]*20*scale/5)*5);
      blocks.push({k:k,type:'Revision',min:m,reason:by[k]+' chapter(s) due for spaced revision'});
    });
  }
  var left=mins-blocks.reduce(function(s,b){return s+b.min;},0);
  var w=weights(P,X,I.phase,null),phase=I.phase;
  if(phase==='mock'&&left>=120&&Math.floor(t.getTime()/864e5)%2===0){
    var top=Object.keys(w).sort(function(a,b){return w[b]-w[a];})[0];
    var mm=Math.min(180,Math.round(left*0.6/15)*15);
    blocks.push({k:top,type:'Timed mock / PYQ paper',min:mm,reason:'Write under exam conditions, then review every mistake'});
    left-=mm;
  }
  var al=allocate(left,w);
  Object.keys(al).filter(function(k){return al[k]>0;}).sort(function(a,b){return al[b]-al[a];}).forEach(function(k){
    blocks.push({k:k,type:phase==='learn'?'Study':(phase==='mock'?'Practice / PYQs':'Revise + practice'),min:al[k],reason:why(P,k,phase)});
  });
  return {rest:false,blocks:blocks,rv:rv};
}
function roadmap(c){
  var P=c.P,X=c.X,I=c.I,rem={},rows=[],doneOn=null;
  X.study.forEach(function(k){rem[k]=remH(P,k);});
  var d=I.t,wk=0;
  while(diff(d,I.ex)>=0&&wk<90){
    var end=addDays(d,6);if(end>I.ex)end=I.ex;
    var pc={},sd=0;
    for(var x=d;x<=end;x=addDays(x,1)){
      var dl=diff(x,I.ex),ph=dl<=I.mockDays?'mock':(dl<=I.revDays?'revise':'learn');
      pc[ph]=(pc[ph]||0)+1;
      if(!(P.rest>=0&&x.getDay()===P.rest))sd++;
    }
    var ph2=Object.keys(pc).sort(function(a,b){return pc[b]-pc[a];})[0];
    var hrs=sd*P.dailyHours,w=weights(P,X,ph2,rem),al=allocate(Math.round(hrs*60),w),out={};
    Object.keys(al).forEach(function(k){
      var m=ph2==='learn'?Math.min(al[k],Math.round(rem[k]*60)):al[k];
      if(m>0){out[k]=m;rem[k]=Math.max(0,rem[k]-m/60);}
    });
    var tot=Object.keys(rem).reduce(function(s,k){return s+rem[k];},0);
    if(doneOn===null&&tot<0.5)doneOn=end;
    rows.push({n:wk+1,start:d,end:end,ph:ph2,hrs:hrs,alloc:out});
    d=addDays(end,1);wk++;
  }
  return {rows:rows,doneOn:doneOn};
}

/* ---------- revisions ---------- */
function makeRevs(conf,from,exam){
  var base=[1,3,7,15,30],f=conf<=2?0.6:(conf>=4?1.3:1),out=[];
  base.forEach(function(b){
    var off=Math.max(1,Math.round(b*f)),dt=addDays(from,off);
    if(diff(dt,exam)>=1)out.push({id:uid(),due:iso(dt),done:false});
  });
  return out;
}

      else loc.syncedAt=rr.updated_at;
    });
    if(!S.active&&S.profiles[0])S.active=S.profiles[0].id;
    for(var j=0;j<S.profiles.length;j++){
      var P=S.profiles[j];
      if(remote[P.id]&&!P.dirty&&P.syncedAt===remote[P.id].updated_at)continue;
      if(remote[P.id]&&!P.dirty)continue;
      var before=JSON.stringify(stripP(P));
      var u=await cloud.client.from('study_profiles').upsert({user_id:cloud.user.id,profile_id:P.id,data:stripP(P)},{onConflict:'user_id,profile_id'}).select('updated_at').single();
      if(u.error)throw u.error;
      P.syncedAt=u.data.updated_at;
      if(JSON.stringify(stripP(P))===before)P.dirty=false;
    }
    save();
    var stamp=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),warn='';
    try{await pushSummary();await updateMyProgress();}
    catch(e2){warn=' (partner summary not updated: '+((e2&&e2.message)||'error')+')';}
    cloud.syncMsg='Synced '+stamp+warn;
  }catch(e){cloud.syncMsg='Not synced: '+((e&&e.message)?e.message:'offline')+' (will retry)';}
  cloud.busy=false;render();
}

/* re-render without wiping what the user is typing (used by background refreshes) */
function renderKeep(){
  var snap={},fid=document.activeElement&&document.activeElement.id,selS=null;
  document.querySelectorAll('#app input[id],#app textarea[id],#app select[id]').forEach(function(e){
    if(e.type==='checkbox'||e.type==='radio')snap[e.id]={c:e.checked};else snap[e.id]={v:e.value};
  });
  try{if(fid&&document.activeElement.setSelectionRange)selS=[document.activeElement.selectionStart,document.activeElement.selectionEnd];}catch(e){}
  render();
  Object.keys(snap).forEach(function(id){
    var e=document.getElementById(id);if(!e)return;
    if(snap[id].c!==undefined)e.checked=snap[id].c;else if(snap[id].v!==undefined&&snap[id].v!==''&&e.value!==snap[id].v)e.value=snap[id].v;
  });
  if(fid){var f=document.getElementById(fid);if(f){f.focus();try{if(selS&&f.setSelectionRange)f.setSelectionRange(selS[0],selS[1]);}catch(e){}}}
}

/* what a partner MAY see (the database filters it again by your switches). Notes, mistakes, pending work are never included. */
function buildSummary(P){
  var A=analyse(P),X=activeInfo(P,A),I=planInfo(P,A,X),t=today(),ts=iso(t);
  var papers=[];X.groups.forEach(function(g){if(!g.passed)papers=papers.concat(g.p);});
  var subj=[],chap=[],hd=0,hn=0,cd=0,ct=0;
  papers.forEach(function(k){
    var p=P.papers[k],h=hoursDone(P,k),done=p.ch.filter(function(x){return x.status==='done';});
    subj.push({paper:plab(k),name:PAPERS[k].n,hoursDone:r1(h),hoursNeeded:p.h,chaptersDone:done.length,chaptersTotal:p.ch.length});
    chap.push({paper:plab(k),name:PAPERS[k].n,total:p.ch.length,learning:p.ch.filter(function(x){return x.status==='learning';}).length,done:done.map(function(x){return x.name;})});
    hd+=Math.min(h,p.h);hn+=p.h;cd+=done.length;ct+=p.ch.length;
  });
  var mins=function(from,to){return sessMins(P,from,to);};
  var ws=weekStart(t),days={};
  P.sessions.forEach(function(s){days[s.date]=(days[s.date]||0)+s.min;});
  var streak=0,d=t;if(!days[iso(d)])d=addDays(d,-1);
  while(days[iso(d)]>0){streak++;d=addDays(d,-1);}
  var l7=0,ds=0;for(var i=0;i<7;i++){var m=days[iso(addDays(t,-i))]||0;l7+=m;if(m>0)ds++;}
  var tot=P.sessions.reduce(function(a,s){return a+s.min;},0);
  var due=revDue(P,t).length,comp=0,sched=0,lim=iso(addDays(t,7)),from7=iso(addDays(t,-6));
  Object.keys(P.papers).forEach(function(k){P.papers[k].ch.forEach(function(c){(c.revs||[]).forEach(function(r){
    if(r.done&&r.doneOn&&r.doneOn>=from7)comp++;
    if(!r.done&&r.due>ts&&r.due<=lim)sched++;
  });});});
  return {
    name:P.name,
    overall:{level:LEVELS[P.level].name,exam:aLabel(aIdx(I.ex)),daysLeft:I.days,phase:I.phase,syllabusHoursPct:hn?Math.round(hd/hn*100):0,chaptersDone:cd,chaptersTotal:ct},
    subjects:subj,
    chapters:chap,
    goals:{dailyGoalH:P.dailyHours,weeklyGoalH:P.weeklyGoal,todayHours:r1(mins(t,t)/60),weekHours:r1(mins(ws,addDays(ws,6))/60),targetMark:P.target},
    study_time:{last7Hours:r1(l7/60),daysStudiedLast7:ds,streakDays:streak,totalHours:r1(tot/60)},
    tests:{attempts:P.attempts.map(function(a){var m={};Object.keys(a.marks).forEach(function(k){m[plab(k)]=a.marks[k];});return {label:a.label,marks:m};}),
           mocks:P.mocks.slice(-10).map(function(x){return {paper:plab(x.paper),pct:x.max>0?Math.round(x.score/x.max*100):0,date:x.date};})},
    revisions:{dueNow:due,completedLast7:comp,scheduledNext7:sched}
  };
}

function sessMins(P,from,to){return P.sessions.filter(function(s){return s.date>=iso(from)&&s.date<=iso(to);}).reduce(function(t,s){return t+s.min;},0);}
function goalsCard(P){
  var t=today(),ws=weekStart(t),td=sessMins(P,t,t),wk=sessMins(P,ws,addDays(ws,6));
  var dg=P.dailyHours*60,wg=P.weeklyGoal*60;
  var h='<h2>Goals</h2><div class="card"><div class="mut" style="margin-bottom:6px">Study streak: '+streakDays(P)+' day(s)</div><div class="row sp"><span>Today</span><span>'+fmtMin(td)+' / '+fmtMin(Math.round(dg))+'</span></div><div class="bar"><i style="width:'+clamp(td/dg*100,0,100)+'%"></i></div>'+
    '<div class="row sp" style="margin-top:10px"><span>This week</span><span>'+fmtMin(wk)+' / '+fmtMin(Math.round(wg))+'</span></div><div class="bar"><i style="width:'+clamp(wk/wg*100,0,100)+'%"></i></div>';
  var hist='';
  for(var i=1;i<=6;i++){
    var s=addDays(ws,-7*i),m=sessMins(P,s,addDays(s,6));
    hist='<div style="text-align:center;flex:1"><div class="bar" style="height:44px;display:flex;align-items:flex-end;background:var(--bd)"><i style="width:100%;height:'+clamp(m/wg*100,0,100)+'%"></i></div><div class="mut" style="font-size:11px">'+(s.getDate())+' '+MON[s.getMonth()]+'<br>'+r1(m/60)+'h</div></div>'+hist;
  }
  h+='<div class="mut" style="margin:12px 0 4px">Last 6 weeks (hours logged vs weekly goal)</div><div class="row" style="flex-wrap:nowrap;align-items:flex-end">'+hist+'</div>';
  var lw=sessMins(P,addDays(ws,-7),addDays(ws,-1));
  if(P.sessions.length&&lw<wg*0.8)h+='<p class="mut" style="margin-bottom:0">Last week you logged '+r1(lw/60)+' h against a goal of '+P.weeklyGoal+' h. Recovery: add one extra block per day this week instead of one long catch-up day, or lower the goal to a number you can keep.</p>';
  return h+'</div>';
}

function groupVerdict(g){
  if(g.pass)return '<span class="chip ok">Passed</span> '+g.n+': '+r1(g.sum)+'/'+g.max;
  var why=[];
  if(g.miss.length)why.push('absent in '+g.miss.map(plab).join(', ')+' (no exemption possible)');
  if(g.low.length)why.push('below 40 in '+g.low.map(plab).join(', '));
  if(g.aggFail)why.push('aggregate below 50%');
  return '<span class="chip bad">Not passed</span> '+g.n+': '+r1(g.sum)+'/'+g.max+(why.length?' \u2022 '+why.join('; '):'');
}

async function aiAsk(P){
  var a=ui.ai;a.mode=readv('ai-mode')||a.mode;a.q=readv('ai-q').trim();if(a.mode==='material')a.mat=readv('ai-mat');var cx=document.getElementById('ai-ctx');a.ctx=cx?cx.checked:a.ctx;

  if(a.mode==='material'&&!String(a.mat||'').trim()){a.err='Paste the text from your material first';a.ans='';render();return;}
  a.busy=true;a.err='';a.ans='';render();
  try{
    var r=await cloud.client.functions.invoke('ai-tutor',{body:{mode:a.mode,question:a.q,context:a.mode==='material'?'':(a.ctx?aiContext(P):''),material:a.mode==='material'?String(a.mat||'').slice(0,6000):''}});
    if(r.error){
      var msg='The AI function is not reachable. Has it been deployed? (see the setup guide)';
      try{if(r.error.context&&r.error.context.json){var j=await r.error.context.json();if(j&&j.error)msg=j.error;}}catch(e){}
      throw new Error(msg);
    }
    if(r.data&&r.data.error)throw new Error(r.data.error);
    a.ans=(r.data&&r.data.answer)||'No answer came back.';
  }catch(e){a.err=(e&&e.message)||'Something went wrong';}
  a.busy=false;render();
}

/* ---------- render ---------- */
function render(){
  var app=document.getElementById('app'),P=cur();
  document.documentElement.dataset.theme=theme();
  if(!P||ui.onb){app.innerHTML=head(P)+viewOnboard();return;}
  normP(P);
  var A=analyse(P),X=activeInfo(P,A),I=planInfo(P,A,X),c={P:P,A:A,X:X,I:I},body='';
  if(ui.tab==='today')body=viewToday(c);
  else if(ui.tab==='papers')body=viewPapers(c);
  else if(ui.tab==='results')body=viewResults(c);
  else if(ui.tab==='plan')body=viewPlan(c);
  else if(ui.tab==='log')body=viewLog(c);
  else if(ui.tab==='partner')body=viewPartner(c);
  else if(ui.tab==='ai')body=viewAI(c);
  else body=viewSettings(c);
  var y=window.scrollY;
  app.innerHTML=head(P)+body+nav()+modalHtml(c);
  try{window.scrollTo(0,y);}catch(e){}
}

/* ---------- actions ---------- */
function readModal(){
  var m=ui.modal;if(!m||m.type!=='session')return;
  var g=function(id){var e=document.getElementById(id);return e?e.value:'';};
  m.k=g('sm-k')||m.k;m.ch=g('sm-ch');m.min=Number(g('sm-min'))||60;m.rate=g('sm-rate');m.mis=g('sm-mis');m.pen=g('sm-pen');
}
function nextSuggestion(P,s){
  if(s.rating&&s.rating<=2)return 'You rated this '+s.rating+'/5. Redo the confusing parts tomorrow and solve about 10 questions on it before moving on.';
  if(s.pending)return 'You noted pending work: '+s.pending+'. Clear it first in your next session.';
  var A=analyse(P),X=activeInfo(P,A),I=planInfo(P,A,X),w=weights(P,X,I.phase,null);
  var top=Object.keys(w).filter(function(k){return k!==s.paper;}).sort(function(a,b){return w[b]-w[a];})[0]||s.paper;
  return 'Next suggested paper: '+pfull(top)+' ('+why(P,top,I.phase)+').';
}
function getCh(P,k,id){var l=P.papers[k]?P.papers[k].ch:[];for(var i=0;i<l.length;i++)if(l[i].id===id)return l[i];return null;}
function setDone(P,k,ch){
  if(!ch.revs||!ch.revs.length)ch.revs=makeRevs(ch.conf,today(),parse(P.examDate));
  ch.status='done';ch.doneOn=iso(today());
}
function allKeys(P){var L=LEVELS[P.level],k=[];Object.keys(L.groups).forEach(function(g){k=k.concat(L.groups[g].p);});return k;}

    try{var bl=new Blob([txt],{type:'text/calendar'}),u=URL.createObjectURL(bl),lk=document.createElement('a');lk.href=u;lk.download='studyos-reminder.ics';document.body.appendChild(lk);lk.click();lk.remove();setTimeout(function(){URL.revokeObjectURL(u);},2000);toast('Reminder file downloaded. Open it to add to your calendar.');}catch(e){toast('Could not create the file');}

    commit();return;
  }
  if(a==='revdone'||a==='revhard'){
    var ch2=getCh(P,d.k,d.c);if(!ch2)return;
    var rv=(ch2.revs||[]).filter(function(x){return x.id===d.r;})[0];if(!rv)return;
    if(a==='revdone'){rv.done=true;rv.doneOn=iso(today());}
    else{rv.due=iso(addDays(today(),1));ch2.conf=Math.max(1,ch2.conf-1);}
    commit();toast(a==='revdone'?'Revision done':'Moved to tomorrow, confidence lowered');return;
  }
  if(a==='addch'){
    var ta=document.getElementById('addch-'+d.k);if(!ta)return;
    var names=ta.value.split('\n').map(function(x){return x.trim();}).filter(Boolean);
    if(!names.length){toast('Type at least one chapter name');return;}
    names.forEach(function(n){P.papers[d.k].ch.push({id:uid(),name:n.slice(0,120),status:'todo',conf:3,revs:[]});});
    commit();toast(names.length+' chapter(s) added');return;
  }
  if(a==='tgl'){ui.open[d.k]=!ui.open[d.k];render();return;}
  if(a==='loadch'){
    var list=SYL[d.k]||[];
    if(!list.length){toast('No chapter list for this paper. Add your own below.');return;}
    var have={},added=0,L=P.papers[d.k].ch;
    L.forEach(function(x){have[x.name.toLowerCase()]=1;});
    list.forEach(function(nm){
      if(SUB[nm]){
        var idx=-1;L.forEach(function(x,i){if(x.name===nm)idx=i;});
        var st='todo',old=null;
        if(idx>=0){old=L[idx];st=old.status;L.splice(idx,1);}
        var items=SUB[nm].filter(function(u){return !have[(nm+' \u203a '+u).toLowerCase()];}).map(function(u){var c=mkCh(nm,u,st);if(old&&st==='done'){c.doneOn=old.doneOn;c.revs=old.revs||[];c.conf=old.conf||3;}return c;});
        L.splice(idx>=0?idx:L.length,0,...items);added+=items.length;
      }else if(!have[nm.toLowerCase()]){L.push({id:uid(),name:nm,status:'todo',conf:3,revs:[]});added++;}
    });
    commit();toast(added?added+' items added':'Already loaded');return;
  }
  if(a==='splitch'){
    var ch0=getCh(P,d.k,d.c);if(!ch0)return;
    var txt=prompt('Type the units / standards of this chapter, separated by commas:','');
    if(!txt)return;
    var us=txt.split(',').map(function(x){return x.trim();}).filter(Boolean);
    if(!us.length)return;
    var L2=P.papers[d.k].ch,ix=L2.indexOf(ch0),g=ch0.name;
    var its=us.map(function(u){return mkCh(g,u.slice(0,100),ch0.status);});
    if(ch0.status==='done')its.forEach(function(c){c.doneOn=ch0.doneOn;c.revs=[];setDone(P,d.k,c);});
    L2.splice(ix,1,...its);commit();toast(its.length+' units created');return;
  }
  if(a==='tick'){
    var ch1=getCh(P,d.k,d.c);if(!ch1)return;
    setDone(P,d.k,ch1);commit();toast('Ticked: '+lblOf(ch1));return;
  }
  if(a==='delch'){
    if(confirm('Remove this chapter?')){P.papers[d.k].ch=P.papers[d.k].ch.filter(function(x){return x.id!==d.c;});commit();}
    return;
  }
  if(a==='saveres'){
    var r2=ui.res,marks={},any=false,bad=false;
    allKeys(P).forEach(function(k){
      var v=r2.marks[k];
      if(v===undefined||v===null||v==='')return;
      var n=Number(v);
      if(isNaN(n)||n<0||n>100){bad=true;return;}
      marks[k]=n;any=true;
    });
    if(bad){toast('Marks must be between 0 and 100');return;}
    if(!any){toast('Enter marks for at least one paper');return;}
    var label=aLabel(r2.idx),date=iso(aDate(r2.idx));
    var exists=P.attempts.some(function(x){return x.label===label&&x.id!==r2.id;});
    if(exists&&!confirm('A result for '+label+' already exists. Replace it?'))return;
    P.attempts=P.attempts.filter(function(x){return x.id!==r2.id&&x.label!==label;});
    P.attempts.push({id:r2.id||uid(),label:label,date:date,marks:marks});
    ui.res=null;commit();toast('Result saved');return;
  }
  if(a==='cancelres'){ui.res=null;render();return;}
  if(a==='editres'){
    var at=P.attempts.filter(function(x){return x.id===d.id;})[0];
    if(at){ui.res={id:at.id,idx:aIdx(parse(at.date)),marks:Object.assign({},at.marks)};render();window.scrollTo(0,0);}
    return;
  }
  if(a==='delres'){
    if(confirm('Delete this result?')){P.attempts=P.attempts.filter(function(x){return x.id!==d.id;});commit();}
    return;
  }
  if(a==='plannext'){
    var A=analyse(P);
    var sorted=P.attempts.slice().sort(function(x,y){return x.date<y.date?-1:(x.date>y.date?1:0);});
    var last=sorted[sorted.length-1];if(!last)return;
    var idx=aIdx(parse(last.date))+1;
    while(diff(today(),aDate(idx))<30)idx++;
    if(!confirm('Set your next exam to '+aLabel(idx)+' ('+fmt(aDate(idx))+') and restart hour counting from today? Hours needed per paper will be adjusted using your last marks. You can edit everything afterwards.'))return;
    var ic3=icaiStart(P.level,P.groups,aLabel(idx));
    P.examDate=ic3||iso(aDate(idx));P.dateAuto=true;P.planStart=iso(today());
    var X2=activeInfo(P,A);
    X2.study.forEach(function(k){
      var lv=lastScore(P,k),f=lv===null?1:clamp(0.45+0.55*(1-Math.min(lv,60)/60),0.45,1);
      P.papers[k].h=Math.max(10,Math.round(PAPERS[k].h*f));
    });
    ui.tab='today';commit();toast('Next attempt planned');return;
  }
  if(a==='showall'){ui.showAll=!ui.showAll;render();return;}
  if(a==='addmock'){
    var sc=document.getElementById('mk-score').value,mx=Number(document.getElementById('mk-max').value),dt=document.getElementById('mk-date').value;
    if(!dt||sc===''||!(mx>0)||Number(sc)<0||Number(sc)>mx){toast('Enter a valid score');return;}
    P.mocks.push({id:uid(),paper:document.getElementById('mk-paper').value,date:dt,score:Number(sc),max:mx});
    commit();toast('Score added');return;
  }
  if(a==='delmock'){P.mocks=P.mocks.filter(function(x){return x.id!==d.id;});commit();return;}
  if(a==='pdone'){P.sessions.forEach(function(s2){if(s2.id===d.id)s2.pdone=true;});commit();return;}
  if(a==='delsess'){
    if(confirm('Delete this session? Its hours will be removed from the plan.')){P.sessions=P.sessions.filter(function(x){return x.id!==d.id;});commit();}
    return;
  }
  if(a==='saveset'){
    var nm=document.getElementById('st-name').value.trim()||P.name;
    var h2=Number(document.getElementById('st-hours').value),wg=Number(document.getElementById('st-wg').value),tg=Number(document.getElementById('st-target').value),dt2=document.getElementById('st-date').value;
    if(!dt2){toast('Choose the exam date');return;}
    if(!(h2>=1&&h2<=14)||!(wg>=1&&wg<=90)||!(tg>=40&&tg<=100)){toast('Check hours (1-14), weekly goal (1-90) and target (40-100)');return;}
    var gs=[];
    document.querySelectorAll('[data-grp]').forEach(function(e){if(e.checked)gs.push(e.dataset.grp);});
    if(P.level==='foundation')gs=['ALL'];
    if(!gs.length){toast('Pick at least one group');return;}
    P.name=nm;P.dailyHours=h2;P.weeklyGoal=wg;P.target=tg;P.groups=gs;
    var ic2=icaiStart(P.level,gs,aLabel(aIdx(parse(dt2))));P.dateAuto=(dt2===ic2)||(!ic2&&dt2===iso(aDate(aIdx(parse(dt2)))));P.examDate=dt2;P.rest=Number(document.getElementById('st-rest').value);
    commit();toast('Settings saved');return;
  }
  if(a==='export'){
    var blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});
    var u=URL.createObjectURL(blob),an=document.createElement('a');
    an.href=u;an.download='studyos-backup-'+iso(today())+'.json';
    document.body.appendChild(an);an.click();an.remove();
    setTimeout(function(){URL.revokeObjectURL(u);},1000);toast('Backup downloaded');return;
  }
  if(a==='import'){document.getElementById('impf').click();return;}
}

function startOnb(){
  var idx=defaultAttemptIdx();
  ui.onb={name:'',level:'inter',route:'foundation',gtype:'commerce',gpct:'',hist:{},g1:true,g2:false,idx:idx,date:iso(aDate(idx)),hours:6,rest:0};
}

function chg(k,d,el){
  if(k==='hfidx'){if(ui.hf)ui.hf.idx=Number(el.value);return;}
  var P=cur();
  if(k==='prof'){S.active=el.value;ui.res=null;ui.modal=null;save();render();return;}
  if(k==='aimode'){var a9=ui.ai;a9.q=readv('ai-q');a9.mat=readv('ai-mat')||a9.mat;var cx9=document.getElementById('ai-ctx');if(cx9)a9.ctx=cx9.checked;a9.mode=el.value;render();return;}
  if(k==='tmpaper'){ui.tm=ui.tm||{};ui.tm.k=el.value;render();return;}
  if(k==='onattempt'){if(ui.onb){ui.onb.idx=Number(el.value);onbDate(ui.onb);render();}return;}
  if(k==='residx'){if(ui.res){ui.res.idx=Number(el.value);render();}return;}
  if(k==='importfile'){
    var f=el.files&&el.files[0];if(!f)return;
    var rd=new FileReader();
    rd.onload=function(){
      try{
        var o=JSON.parse(rd.result);
        if(!o||!Array.isArray(o.profiles))throw new Error('bad');
        var added=0;
        o.profiles.forEach(function(p){
          if(!p||!LEVELS[p.level]||!p.papers||!p.groups)return;
          p.attempts=p.attempts||[];p.sessions=p.sessions||[];p.mocks=p.mocks||[];
          if(S.profiles.some(function(x){return x.id===p.id;}))p.id=uid();
          p.dirty=true;delete p.syncedAt;S.profiles.push(p);added++;
        });
        if(!added)throw new Error('none');
        if(!S.active)S.active=S.profiles[0].id;
        commit();toast(added+' profile(s) imported');
      }catch(e){toast('That file is not a valid backup');}
    };
    rd.readAsText(f);el.value='';return;
  }
  if(!P)return;
  if(cchg(k,d,el))return;
  if(k==='hours'){var v=Number(el.value);if(v>=1)P.papers[d.k].h=v;commit();return;}
  if(k==='focus'){P.papers[d.k].focus=el.checked;commit();return;}
  if(k==='chstatus'){
    var ch=getCh(P,d.k,d.c);if(!ch)return;
    if(el.value==='done')setDone(P,d.k,ch);else ch.status=el.value;
    commit();if(el.value==='done')toast('Revisions scheduled automatically');return;
  }
  if(k==='chconf'){var c2=getCh(P,d.k,d.c);if(c2)c2.conf=Number(el.value);P.dirty=true;save();schedSync();return;}
  if(k==='smpaper'){readModal();ui.modal.ch='';render();return;}
}

document.addEventListener('input',function(e){
  var t=e.target,d=t.dataset||{};
  if(d.ob&&ui.onb)ui.onb[d.ob]=t.type==='checkbox'?t.checked:t.value;
  if(d.mk&&ui.res)ui.res.marks[d.mk]=t.value===''?undefined:Number(t.value);
  if(d.hm&&ui.hf)ui.hf.marks[d.hm]=t.value===''?undefined:Number(t.value);
});
document.addEventListener('change',function(e){
  var t=e.target,d=t.dataset||{};
  if(d.ob&&ui.onb){
    ui.onb[d.ob]=t.type==='checkbox'?t.checked:t.value;
    if(d.ob==='level'){ui.onb.route=ui.onb.level==='inter'?'foundation':'passed';ui.hf=null;ui.onb.g1=true;ui.onb.g2=false;onbDate(ui.onb);render();}
    else if(d.ob==='g1'||d.ob==='g2'){if(!ui.onb.g1&&!ui.onb.g2){ui.onb[d.ob]=true;}onbDate(ui.onb);render();}
    else if(d.ob==='route'||d.ob==='gtype'||d.ob==='confirmInter'){render();}
    else if(d.ob==='date'){ui.onb.auto=false;ui.onb.hasIcai=false;render();}
    return;
  }
  if(d.mk&&ui.res){ui.res.marks[d.mk]=t.value===''?undefined:Number(t.value);return;}
  if(d.chg)chg(d.chg,d,t);
});
document.addEventListener('click',function(e){
  var t=e.target.closest?e.target.closest('[data-act]'):null;
  if(t)act(t.dataset.act,t.dataset,t);
});

setInterval(function(){var e=document.getElementById('tm-el'),t=tmGet();if(e&&t)e.textContent=tmText(t);},500);
window.__so={priorScore:priorScore,weak:weak,canStart:canStart,directOK:directOK,histA:histA,CAL:function(){return CAL;},SYLV:function(){return SYLVER;},icaiStart:icaiStart,applyRemote:applyRemote,applySyl:applySyl,sylDiff:sylDiff,weakChapters:weakChapters,weekText:weekText,icsText:icsText,streakDays:streakDays,normP:normP,onbDate:onbDate,tmSet:tmSet,cloud:cloud,SYL:SYL,S:function(){return S;},analyse:analyse,activeInfo:activeInfo,planInfo:planInfo,newProfile:newProfile,todayPlan:todayPlan,roadmap:roadmap,makeRevs:makeRevs,render:render,ui:ui,aIdx:aIdx,aLabel:aLabel,cur:cur,save:save};
render();
})();
